[project]
name = "tradehub"
version = "0.1.0"
description = "Kalshi trade hub: edge engines, settlement and track record"
requires-python = ">=3.11"
dependencies = [
    "aiohttp",
    "cryptography>=41.0.0",
    "fastapi>=0.110.0",
    "fastmcp",
    "joblib>=1.3.0",
    "langgraph",
    "lightgbm>=4.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "supabase>=2.0.0",
    "ta>=0.11.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "yfinance>=0.2.28",
]

[project.optional-dependencies]
# Heavier deps used only by tradehub.scripts.background_scanner's AI/news path and HF model downloads.
scanner = [
    "fredapi>=0.5.1",
    "google-genai>=0.1.0",
    "huggingface_hub",
    "python-dateutil",
    "sentencepiece>=0.1.99",
    "torch>=2.1.0",
    "transformers>=4.36.0",
]
research = [
    "apscheduler>=3.10.4",
    "ipykernel",
    "jupyter>=1.0.0",
    "lxml>=5.0.0",
    "matplotlib>=3.7.0",
    "meteostat",
    "optuna>=3.4.0",
    "plotly>=5.15.0",
    "pytz",
    "seaborn>=0.13.0",
    "shap>=0.42.0",
    "statsmodels>=0.14.0",
    "vectorbt>=0.25.0",
]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
extend-exclude = ["research", "archive", "_attic", "market_sentiment_tool/node_modules"]
