name: Build and deploy Trade Hub

on:
  push:
    branches: [main]
    paths:
      - "tradehub/**"
      - "shared/**"
      - "market_sentiment_tool/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-tradehub.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/kevocado/tradehub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r pyproject.toml --extra dev --extra scanner
      - name: Run tests
        env:
          SUPABASE_SERVICE_ROLE_KEY: dummy-baseline-placeholder
        run: python -m pytest -q

  # The `test` job above is `python -m pytest -q` and nothing else, so every test in
  # market_sentiment_tool was never executed by this workflow -- on this branch or any other. The
  # Dockerfile's `npm run build` is `vite build`, which does not typecheck and does not run tests,
  # so a `tsc` break and a broken vitest file both shipped green. 128 frontend tests that never run
  # are not tests. This job is what makes any future PR's frontend test claim mean something, and
  # it runs on the same `paths:` triggers as the Python one.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market_sentiment_tool
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's node:20-slim build stage, so the job tests the toolchain the
          # image is actually built with.
          node-version: "20"
          cache: npm
          cache-dependency-path: market_sentiment_tool/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        # Separate from the tests on purpose. `vite build` transpiles without checking types, so
        # without this a type error is invisible until someone reads the compiler output.
        run: npm run typecheck
      - name: Frontend tests
        run: npx vitest run

  build:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Deploys the image to the VPS stack (/opt/stack; see the vps-stack README).
  # Switched on by the VPS_HOST repo variable.
  vps:
    needs: build
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    concurrency: vps-deploy-tradehub
    steps:
      # A green build with a red `vps` job used to mean "your code broke" when it meant "the disk is
      # full". `b49879e` failed extracting a layer with `no space left on device` on a 99%-full 38G
      # disk -- 611MB free, 35 images totalling 33.91GB -- and the *identical commit* deployed fine
      # after a manual 7.26GB prune. Every merge to `main` pulls a fresh image and leaves the
      # previous one behind, so nothing was ever reclaiming them.
      #
      # This runs BEFORE the pull below, because reclaiming space after the extract has already
      # failed is worthless. It fails soft: `continue-on-error` plus a guard on each prune, so a
      # cleanup step can never block the deploy it exists to unblock.
      #
      # It cannot take the live service down. `docker image prune -a` never removes an image a
      # container references -- running or stopped -- so the current `tradehub` container keeps its
      # own image, and at prune time the old container is still up. `-a` is required: the superseded
      # per-SHA images are tagged rather than dangling, so a plain `docker image prune` reclaims
      # none of them and the disk still creeps.
      #
      # NEVER let a prune here reach volumes, and never swap these for the broader `system prune`
      # subcommand -- it reclaims volumes under its own volumes flag and much else besides. All
      # three local volumes on this host are in use (`kalshi_portfolio` plus the bind-mounted
      # caches), so a volume prune here is data loss on the machine the deploy depends on. These
      # two spellings are kept out of this file entirely, comment included, so that
      # tests/test_repo_layout.py can assert on the whole text and pin them out for good.
      - name: Prune VPS Docker images
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          # The SSH setup is repeated from the step below on purpose: each `run` block is its own
          # shell, so there is nothing to inherit and no way to share it without hiding the commands.
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Free space either side of the prune, so the next person reading a red `vps` job can see
          # the disk state in this log instead of SSHing in to measure it themselves.
          # The guards below use GitHub's workflow-command syntax, which is a *double* colon on
          # both sides of the keyword. With a single colon they are plain log text, so a prune
          # failure would come out silent-but-nonfatal, the one combination nobody benefits from.
          # tests/test_repo_layout.py pins the two-colon form on every guard and forbids the
          # single-colon variant anywhere in this file.
          ssh deploy@${{ vars.VPS_HOST }} 'sh -s' <<'REMOTE'
            df -h / || echo "::warning:: could not read free space before prune"
            docker image prune -a -f || echo "::warning:: image prune failed; deploying anyway"
            docker builder prune -f || echo "::warning:: builder prune failed; deploying anyway"
            df -h / || echo "::warning:: could not read free space after prune"
          REMOTE

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh deploy@${{ vars.VPS_HOST }} deploy tradehub ${{ github.sha }}
